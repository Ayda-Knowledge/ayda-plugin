name: Check

on:
  # Every merge into dev gets the run. One run is active and the newest
  # waiting run is kept. A pull request starts no run: its author records
  # local checks in it, and promotion.yml gates main on this workflow's
  # result for the dev commit.
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The evidence a promotion reads is this run's commit, so prove the tree
      # under test is that commit.
      - name: Verify the checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Skill packages
        run: python3 scripts/check-skills.py
      - name: Plugin manifest
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.284
          claude plugin validate plugin --strict
          claude plugin validate . --strict
