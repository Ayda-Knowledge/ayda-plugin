name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skill packages
        run: python3 scripts/check-skills.py
      - name: Plugin manifest
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.284
          claude plugin validate . --strict
